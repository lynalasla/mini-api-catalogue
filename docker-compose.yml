version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-catalogue
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalogue
      MYSQL_USER: catalogue_user
      MYSQL_PASSWORD: catalogue_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-catalogue
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: catalogue_user
      PMA_PASSWORD: catalogue_password
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mini-api-catalogue:
    build: .
    container_name: mini-api-catalogue
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=catalogue_user
      - DB_PASSWORD=catalogue_password
      - DB_NAME=catalogue
      - DB_PORT=3306
      - DATABASE_URL=mysql://catalogue_user:catalogue_password@mysql:3306/catalogue
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-2024
    depends_on:
      mysql:
        condition: service_healthy

  react-dev:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: belibeli-react-dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - mini-api-catalogue
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: belibeli-nginx
    ports:
      - "80:80"
    depends_on:
      - mini-api-catalogue
    restart: unless-stopped

volumes:
  mysql_data:
