version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-catalogue
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalogue
      MYSQL_USER: catalogue_user
      MYSQL_PASSWORD: catalogue_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mini-api-catalogue:
    build: .
    container_name: mini-api-catalogue
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=catalogue_user
      - DB_PASSWORD=catalogue_password
      - DB_NAME=catalogue
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
