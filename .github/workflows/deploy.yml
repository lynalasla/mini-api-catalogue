name: Deploy to Production

on:
    push:
        branches: [main]
        tags:
            - "v*.*.*"
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy Application
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
              uses: docker/login-action@v3
              continue-on-error: true
              with:
                  username: ${{ secrets.DOCKER_USERNAME || 'default' }}
                  password: ${{ secrets.DOCKER_PASSWORD || 'default' }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: mini-api-catalogue
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha

            - name: Build and push Backend Docker image
              if: ${{ secrets.DOCKER_USERNAME != '' }}
              uses: docker/build-push-action@v5
              continue-on-error: true
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push Frontend Docker image
              if: ${{ secrets.DOCKER_USERNAME != '' }}
              uses: docker/build-push-action@v5
              continue-on-error: true
              with:
                  context: ./client
                  file: ./client/Dockerfile
                  push: false
                  tags: mini-api-catalogue-frontend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to Server
              if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_KEY != '' }}
              uses: appleboy/ssh-action@master
              continue-on-error: true
              with:
                  host: ${{ secrets.DEPLOY_HOST || 'localhost' }}
                  username: ${{ secrets.DEPLOY_USER || 'user' }}
                  key: ${{ secrets.DEPLOY_KEY || 'key' }}
                  script: |
                      cd /opt/mini-api-catalogue
                      docker-compose pull
                      docker-compose up -d
                      docker system prune -af
