name: CI/CD Pipeline

on:
    push:
        branches: [main, frontend, Docker]
    pull_request:
        branches: [main, frontend, Docker]

jobs:
    # Job 1: Test Backend
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root_password
                    MYSQL_DATABASE: catalogue_test
                    MYSQL_USER: catalogue_user
                    MYSQL_PASSWORD: catalogue_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install backend dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run Prisma Migrations
              env:
                  DATABASE_URL: mysql://catalogue_user:catalogue_password@localhost:3306/catalogue_test
              run: npx prisma migrate deploy

            - name: Run backend tests
              env:
                  DATABASE_URL: mysql://catalogue_user:catalogue_password@localhost:3306/catalogue_test
                  JWT_SECRET: test_secret_key
                  NODE_ENV: test
              run: npm test --if-present

            - name: Lint backend code
              run: npm run lint --if-present

    # Job 2: Test Frontend
    frontend-tests:
        name: Frontend Tests
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./client

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: client/package-lock.json

            - name: Install frontend dependencies
              run: npm ci

            - name: Lint frontend code
              run: npm run lint --if-present

            - name: Build frontend
              run: npm run build

            - name: Run frontend tests
              run: npm test --if-present

    # Job 3: Build Docker Images
    docker-build:
        name: Build Docker Images
        runs-on: ubuntu-latest
        needs: [backend-tests, frontend-tests]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Backend Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  tags: mini-api-catalogue:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build Frontend Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: ./client
                  file: ./client/Dockerfile
                  push: false
                  tags: mini-api-catalogue-frontend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # Job 4: Security Scan
    security-scan:
        name: Security Vulnerability Scan
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            actions: read
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner (Backend)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results-backend.sarif"

            - name: Upload Trivy results to GitHub Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                  sarif_file: "trivy-results-backend.sarif"

    # Job 5: Code Quality
    code-quality:
        name: Code Quality Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              continue-on-error: true

    # Job 6: A/B Testing Python Tests
    ab-testing-tests:
        name: A/B Testing Python Tests
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./ab_testing

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: ab_testing/requirements.txt

            - name: Install Python dependencies
              run: pip install -r requirements.txt

            - name: Install dev dependencies
              run: pip install flake8 pylint pytest

            - name: Lint with flake8
              run: |
                  # Stop build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # Check all Python files for style and errors
                  flake8 . --count --max-line-length=79 --statistics

            - name: Lint with pylint
              run: pylint *.py --disable=C0103,C0114,C0115,C0116 --max-line-length=79
              continue-on-error: true

            - name: Type check
              run: python -m py_compile *.py

            - name: Run Python tests
              run: pytest --verbose --tb=short
              continue-on-error: true

            - name: Test imports
              run: |
                  python -c "from ab_test import ABTest, Variant, ABTestManager"
                  python -c "from statistical_analysis import ABTestAnalyzer, analyze_test"
                  python -c "from examples import setup_example_tests"
                  echo "✅ All imports successful"

            - name: Test example setup
              run: python -c "from examples import setup_example_tests; setup_example_tests(); print('✅ Examples setup successful')"
