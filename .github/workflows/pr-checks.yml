name: Pull Request Checks

on:
    pull_request:
        branches: [main, frontend, develop]

jobs:
    pr-validation:
        name: PR Validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Check for package.json changes
              id: package-check
              run: |
                  if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -q "package.json"; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Comment on PR if package.json changed
              if: steps.package-check.outputs.changed == 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: '⚠️ **Notice**: `package.json` has been modified. Please ensure package-lock.json is updated and committed.'
                      })

    label-pr:
        name: Auto Label PR
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Label PR based on files changed
              uses: actions/labeler@v5
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

    size-check:
        name: PR Size Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check PR size
              run: |
                  FILES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)
                  LINES_CHANGED=$(git diff --stat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tail -1 | awk '{print $4+$6}')

                  echo "Files changed: $FILES_CHANGED"
                  echo "Lines changed: $LINES_CHANGED"

                  if [ $FILES_CHANGED -gt 50 ] || [ $LINES_CHANGED -gt 1000 ]; then
                    echo "⚠️ Warning: This PR is quite large. Consider splitting it into smaller PRs."
                    exit 1
                  fi
