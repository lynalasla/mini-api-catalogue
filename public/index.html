<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini API Catalogue - Interface Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .tab-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
        }
        
        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-section {
            margin-bottom: 40px;
        }
        
        .form-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .list-section {
            margin-top: 30px;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .item-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .item-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .item-card p {
            color: #666;
            margin-bottom: 5px;
        }
        
        .item-card .price {
            font-size: 1.5em;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Mini API Catalogue - Interface Admin</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('categories')">📁 Catégories</button>
            <button class="tab-btn" onclick="switchTab('products')">📦 Produits</button>
        </div>
        
        <!-- Tab Catégories -->
        <div id="categories" class="tab-content active">
            <div class="form-section">
                <h2>Ajouter une catégorie</h2>
                <div id="category-message" class="message"></div>
                <form id="category-form">
                    <div class="form-group">
                        <label for="category-name">Nom de la catégorie *</label>
                        <input type="text" id="category-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="category-description">Description</label>
                        <textarea id="category-description" name="description"></textarea>
                    </div>
                    <button type="submit">Ajouter la catégorie</button>
                </form>
            </div>
            
            <div class="list-section">
                <h2>Liste des catégories</h2>
                <div id="categories-list" class="items-grid"></div>
            </div>
        </div>
        
        <!-- Tab Produits -->
        <div id="products" class="tab-content">
            <div class="form-section">
                <h2>Ajouter un produit</h2>
                <div id="product-message" class="message"></div>
                <form id="product-form">
                    <div class="form-group">
                        <label for="product-name">Nom du produit *</label>
                        <input type="text" id="product-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" name="description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Prix (€) *</label>
                        <input type="number" id="product-price" name="price" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="product-stock">Stock *</label>
                        <input type="number" id="product-stock" name="stock" min="0" value="0" required>
                    </div>
                    <div class="form-group">
                        <label for="product-category">Catégorie *</label>
                        <select id="product-category" name="categoryId" required>
                            <option value="">Sélectionnez une catégorie</option>
                        </select>
                    </div>
                    <button type="submit">Ajouter le produit</button>
                </form>
            </div>
            
            <div class="list-section">
                <h2>Liste des produits</h2>
                <div id="products-list" class="items-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        
        // Gestion des tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'categories') {
                loadCategories();
            } else if (tabName === 'products') {
                loadCategories();
                loadProducts();
            }
        }
        
        // Afficher un message
        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
        
        // Charger les catégories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/categories`);
                const categories = await response.json();
                
                // Afficher dans la liste
                const listEl = document.getElementById('categories-list');
                listEl.innerHTML = categories.map(cat => `
                    <div class="item-card">
                        <h3>${cat.name}</h3>
                        <p>${cat.description || 'Pas de description'}</p>
                    </div>
                `).join('');
                
                // Remplir le select des produits
                const selectEl = document.getElementById('product-category');
                selectEl.innerHTML = '<option value="">Sélectionnez une catégorie</option>' +
                    categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
            } catch (error) {
                console.error('Erreur lors du chargement des catégories:', error);
            }
        }
        
        // Charger les produits
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                
                const listEl = document.getElementById('products-list');
                listEl.innerHTML = products.map(prod => `
                    <div class="item-card">
                        <h3>${prod.name}</h3>
                        <p>${prod.description || 'Pas de description'}</p>
                        <p class="price">${parseFloat(prod.price).toFixed(2)} €</p>
                        <p>Stock: ${prod.stock}</p>
                        <p><small>Catégorie ID: ${prod.categoryId || prod.category_id}</small></p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur lors du chargement des produits:', error);
            }
        }
        
        // Soumettre le formulaire de catégorie
        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('category-name').value,
                description: document.getElementById('category-description').value
            };
            
            try {
                const response = await fetch(`${API_URL}/categories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    showMessage('category-message', 'Catégorie ajoutée avec succès !', 'success');
                    e.target.reset();
                    loadCategories();
                } else {
                    const error = await response.json();
                    showMessage('category-message', `Erreur: ${error.message || 'Erreur inconnue'}`, 'error');
                }
            } catch (error) {
                showMessage('category-message', `Erreur: ${error.message}`, 'error');
            }
        });
        
        // Soumettre le formulaire de produit
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('product-name').value,
                description: document.getElementById('product-description').value,
                price: parseFloat(document.getElementById('product-price').value),
                stock: parseInt(document.getElementById('product-stock').value),
                categoryId: parseInt(document.getElementById('product-category').value)
            };
            
            try {
                const response = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    showMessage('product-message', 'Produit ajouté avec succès !', 'success');
                    e.target.reset();
                    loadProducts();
                } else {
                    const error = await response.json();
                    showMessage('product-message', `Erreur: ${error.message || 'Erreur inconnue'}`, 'error');
                }
            } catch (error) {
                showMessage('product-message', `Erreur: ${error.message}`, 'error');
            }
        });
        
        // Charger les données au démarrage
        loadCategories();
    </script>
</body>
</html>
