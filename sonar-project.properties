sonar.projectKey=lynalasla_mini-api-catalogue
sonar.organization=lynalasla

# Project information
sonar.projectName=Mini API Catalogue
sonar.projectVersion=1.0

# Source directories
sonar.sources=routes,middleware,config,client/src
sonar.tests=tests,client/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.spec.js,**/config/**

# Language specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=client/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8
